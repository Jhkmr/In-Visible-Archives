<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Value in Image</title>
  <link rel="stylesheet" href="../../fonts.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
</head>

<body>
  <div class="app">
    <div class="canvas-wrap"></div>

    <div class="image-preview">
      <img id="imagePreview" alt="">
    </div>

    <div class="panel-controls">
      <div class="group">
        <button id="btnLoad">Load</button>
        <button id="btnClear">Clear</button>
        <button id="btnSave">Save</button>
        <button id="btnOrientation">Orientation: Portrait</button>
        <button id="btnRandomize">Randomize</button>
        <button id="btnRepeatToggle">Repeat: On</button>
      </div>
    </div>

    <div class="panel-sliders">
      <div class="slider-row slider-row--text">
        <span class="slider-id">A</span>
        <span class="slider-name">Text</span>
        <div class="text-wrap">
          <input type="text" id="textInput" placeholder="Something to note…">
        </div>
        <button id="btnOverrideText">Override</button>
        <button id="btnAddText">Add</button>
      </div>
      <div class="slider-row">
        <span class="slider-id">B</span>
        <span class="slider-name">Text Size</span>
        <div class="slider-wrap">
          <input type="range" id="sliderA" min="6" max="20" step="0.5" value="12">
          <div class="slider-thumb" id="sliderA-thumb">[ 12 ]</div>
        </div>
      </div>
      <div class="slider-row">
        <span class="slider-id">B</span>
        <span class="slider-name">Density</span>
        <div class="slider-wrap">
          <input type="range" id="sliderB" min="0" max="100" step="10" value="40">
          <div class="slider-thumb" id="sliderB-thumb">[ 0 ]</div>
        </div>
      </div>
      <div class="slider-row">
        <span class="slider-id">C</span>
        <span class="slider-name">Start Cell</span>
        <div class="slider-wrap">
          <input type="range" id="sliderC" min="0" max="31" step="1" value="0">
          <div class="slider-thumb" id="sliderC-thumb">[ 0 ]</div>
        </div>
      </div>
      <div class="slider-row">
        <span class="slider-id">C</span>
        <span class="slider-name">Line Height</span>
        <div class="slider-wrap">
          <input type="range" id="sliderD" min="0.2" max="5" step="0.05" value="0.8">
          <div class="slider-thumb" id="sliderD-thumb">[ 0.8 ]</div>
        </div>
      </div>
      <div class="slider-row">
        <span class="slider-id">D</span>
        <span class="slider-name">Word Spacing</span>
        <div class="slider-wrap">
          <input type="range" id="sliderE" min="0" max="100" step="5" value="0">
          <div class="slider-thumb" id="sliderE-thumb">[ 0 ]</div>
        </div>
      </div>
    </div>
  </div>

  <script src="sketch.js"></script>
  <script>
    function updateSliderThumb(input) {
      const thumb = document.getElementById(input.id + '-thumb');
      if (!thumb) return;
      const min = parseFloat(input.min);
      const max = parseFloat(input.max);
      const val = parseFloat(input.value);
      const pct = (val - min) / (max - min);
      // Offset accounts for the thumb's own half-width so it doesn't overflow edges
      const trackWidth = input.offsetWidth;
      const thumbWidth = thumb.offsetWidth;
      const offset = pct * (trackWidth - thumbWidth) + thumbWidth / 2;
      thumb.style.left = offset + 'px';
      thumb.textContent = '[ ' + val + ' ]';
    }

    document.querySelectorAll('.slider-wrap input[type=range]').forEach(input => {
      updateSliderThumb(input);
      input.addEventListener('input', () => updateSliderThumb(input));
    });

    // Re-position on resize (track width changes)
    window.addEventListener('resize', () => {
      document.querySelectorAll('.slider-wrap input[type=range]').forEach(updateSliderThumb);
    });
  </script>
</body>

</html>
