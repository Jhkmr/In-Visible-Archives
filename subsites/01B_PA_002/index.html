<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Grid Tool - Lines</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

  <div id="root">
    <div class="app">
      <div class="canvas-container"></div>
      <div class="panel">
        <div class="panel-section">
          
          <h2>tools</h2>

          <div class="buttons-section">
          <h3>selected</h3>
          <button id="rotateBtn">rotate [r]</button>
          <button id="toggleTypeBtn">angular|level [e]</button>
          <h3>canvas</h3>
          <button id="toggleAllBtn">angular|level all</button>
          <button id="invertBtn">invert all</button>
          <button id="saveBtn">print</button>
          </div>
        </div>
        <div class="panel-section">

          <h2>prints</h2>

          <div class="images-section">
            <div id="imagesContainer" class="images-grid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
  
</body>
</html>
