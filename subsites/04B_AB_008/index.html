<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Shift — Image</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="wrapper">
    <div id="canvas-container"></div>

    <div id="controls">
      <div class="control-group">
        <span class="channel-label r">R</span>
        <select id="waveR">
          <option value="sine">Sine</option>
          <option value="square" selected>Square</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="triangle">Triangle</option>
        </select>
        <select id="ratioR" title="R frequency ratio">
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
        </select>
      </div>

      <div class="control-sep">:</div>

      <div class="control-group">
        <span class="channel-label l">L</span>
        <select id="waveL">
          <option value="sine">Sine</option>
          <option value="square">Square</option>
          <option value="sawtooth" selected>Sawtooth</option>
          <option value="triangle">Triangle</option>
        </select>
        <select id="ratioL" title="L frequency ratio">
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
        </select>
      </div>

      <div class="control-group phase-group">
        <span class="control-label">Phase</span>
        <input type="range" id="phase" min="0" max="12" step="1" value="0">
        <span id="phaseLabel">0°</span>
      </div>

      <div class="control-group image-group">
        <label class="upload-btn" for="imageUpload">Image</label>
        <input type="file" id="imageUpload" accept="image/*">
        <span class="control-label">Warp</span>
        <input type="range" id="distortion" min="1" max="60" step="1" value="20">
        <button id="playBtn">Start</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.2/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
